services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: ["node", "scripts/dev-container.js"]
    environment:
      PORT: "5177"
    ports:
      - "5177:5177"
    volumes:
      - codex_gestion_node_modules:/workspace/node_modules
    develop:
      watch:
        - action: sync
          path: .
          target: /workspace
          ignore:
            - .git/
            - .github/
            - .vscode/
            - node_modules/
            - dist/
            - preview/generated/
            - .codex-gestion/
            - .codex-local-stats/
            - "*.vsix"
            - "*.log"
    restart: unless-stopped

volumes:
  codex_gestion_node_modules:
